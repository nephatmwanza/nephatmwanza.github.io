baseURL = 'https://nephatmwanza.github.io/'
locale = 'en-gb'
title = 'Nephat Mwanza'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

# ---------------------------------------------------------------- menu
[[menu.main]]
  identifier = 'projects'
  name = 'Projects'
  url = '/projects/'
  weight = 10

[[menu.main]]
  identifier = 'posts'
  name = 'Writing'
  url = '/posts/'
  weight = 20

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 30

[[menu.main]]
  identifier = 'cv'
  name = 'CV'
  url = '/cv/'
  weight = 40

[[menu.main]]
  identifier = 'contact'
  name = 'Contact'
  url = '/contact/'
  weight = 50

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 60

# ---------------------------------------------------------------- params
[params]
  env = 'production'
  author = 'Nephat Mwanza'
  description = 'Statistician working on climate and development data in Zambia. Rainfall variability, climate extremes and agricultural risk.'
  keywords = ['climate data', 'statistics', 'Zambia', 'rainfall', 'climate extremes', 'development data']
  defaultTheme = 'auto'
  # Visitor analytics. Set to '' to switch off; nothing is injected when unset.
  # Dashboard: https://nephatmwanza.goatcounter.com
  # NOTE: this must stay above the first [params.*] sub-table. In TOML a key placed
  # after [[params.socialIcons]] belongs to THAT table, not to [params] - which is
  # exactly how this silently failed the first time.
  goatcounter = 'nephatmwanza'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  hidemeta = false
  comments = false
  disableScrollToTop = false

  # home page intro
  [params.homeInfoParams]
    Title = 'Climate extremes and rainfall variability in Zambia'
    Content = """
I am a statistician based in Lusaka, working on rainfall variability, climate extremes and agricultural risk.

My MSc in Statistics at the University of Zambia projected how the country's intra-seasonal rainfall characteristics shift between 1981–2000 and 2021–2050 — work now under review at *PLOS Climate*. I have also worked as a research assistant on trends in Zambian temperature and precipitation extremes over 1981–2021.

A lot of climate analysis is done by people who know the physics but treat the statistics as a formality, or by statisticians who handle the inference carefully but have no feel for what a number means on the ground. Working in both makes it possible to ask a better question — and to know when the data cannot answer it.

I analyse the country I live in, so the context behind the numbers is not something I have to look up.

<a class="home-hero" href="/projects/zambia-rainfall-extremes/">
  <picture>
    <source media="(max-width: 640px)" srcset="/img/home-hero-mobile.webp" type="image/webp">
    <source media="(max-width: 640px)" srcset="/img/home-hero-mobile.png" type="image/png">
    <source srcset="/img/home-hero.webp" type="image/webp">
    <img src="/img/home-hero.png" alt="Four maps of Zambia showing the trend per decade in seasonal rainfall total, longest dry spell, longest wet spell and very-wet-day rainfall">
  </picture>
  <span>How Zambia's rainy season has changed, 1981&ndash;2026 — blue is wetter, red is drier</span>
</a>

<div class="home-cta">
  <a class="btn-primary" href="/projects/">Read the three studies</a>
  <a class="btn-ghost" href="/contact/">Get in touch</a>
</div>

<p class="home-code">Code and data on GitHub:
  <a href="https://github.com/nephatmwanza/zambia-rainfall-extremes">zambia-rainfall-extremes</a> ·
  <a href="https://github.com/nephatmwanza/zambia-temperature-extremes">zambia-temperature-extremes</a> ·
  <a href="https://github.com/nephatmwanza/zambia-cmip6-evaluation">zambia-cmip6-evaluation</a>
</p>

<div class="home-facts">
  <div><strong>MSc Statistics</strong><span>University of Zambia — intra-seasonal rainfall projections</span></div>
  <div><strong>Under review</strong><span>First-author paper submitted to <em>PLOS Climate</em></span></div>
  <div><strong>5+ years</strong><span>Lecturing statistics across Zambian institutions</span></div>
</div>
"""

  [[params.socialIcons]]
    name = 'email'
    title = 'Email me'
    url = 'mailto:nephatmwanza@gmail.com'

  [[params.socialIcons]]
    name = 'github'
    title = 'Code on GitHub'
    url = 'https://github.com/nephatmwanza'

  [[params.socialIcons]]
    name = 'linkedin'
    title = 'LinkedIn'
    url = 'https://www.linkedin.com/in/nephatmwanza'

  [params.assets]
    disableHLJS = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ['title', 'permalink', 'summary', 'content']

# ---------------------------------------------------------------- output
[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON is required for the search page

[markup.goldmark.renderer]
  unsafe = true                    # allow raw HTML in markdown (figures, tables)

[markup.highlight]
  noClasses = false

[taxonomies]
  tag = 'tags'
